<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manuais do Escritório — Demandas</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/><path d="M9 8h7M9 12h5"/></svg>
      </span>
      <div>
        <h1>Manuais do Escritório</h1>
        <p>Lista de demandas — clique em uma demanda para ver o passo a passo com prints e comentários.</p>
      </div>
    </div>
    <button class="theme-toggle" id="btnTheme" title="Alternar para modo claro" aria-label="Alternar tema">
      <svg id="iconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg id="iconSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span id="themeLabel">Modo claro</span>
    </button>
  </div>
</header>

<main class="wrap">
  <div class="toolbar filters">
    <div class="field">
      <label for="busca">Demanda</label>
      <div class="input-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="busca" placeholder="Buscar demanda… (ex.: nota fiscal, frete, certificado)">
      </div>
    </div>
    <div class="field">
      <label for="filtroSetor">Setor</label>
      <select id="filtroSetor"><option value="">Todos os setores</option></select>
    </div>
    <div class="field">
      <label for="filtroPrioridade">Prioridade</label>
      <select id="filtroPrioridade">
        <option value="">Todas prioridades</option>
        <option value="1">Prioridade 1</option>
        <option value="2">Prioridade 2</option>
        <option value="3">Prioridade 3</option>
        <option value="4">Prioridade 4</option>
      </select>
    </div>
    <div class="field">
      <label for="filtroStatus">Status</label>
      <select id="filtroStatus">
        <option value="">Todos status</option>
        <option value="pronto">Com manual</option>
        <option value="pendente">Sem manual / rascunho</option>
      </select>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn ghost" id="btnExport">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
      Exportar backup</button>
    <button class="btn ghost" id="btnImport">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
      Importar backup</button>
    <input type="file" id="fileImport" accept="application/json" hidden>
    <button class="btn ghost" id="btnReset">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      Restaurar planilha</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="list-head">
    <span class="col-prio">Prioridade</span>
    <span class="col-title">Demanda</span>
    <span class="col-setor">Setor</span>
    <span class="col-status">Status</span>
    <span class="col-action"></span>
  </div>
  <div class="list" id="grid"></div>

  <footer>Manuais do escritório • dados iniciais da planilha “Lista de Demandas.xlsx” • edições salvas neste navegador (use Exportar backup para compartilhar).</footer>
</main>

<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/theme.js"></script>
<script src="js/index.js"></script>
</body>
</html>
