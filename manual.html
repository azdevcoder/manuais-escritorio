<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manual — Manuais do Escritório</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main class="wrap">
  <div class="topbar-inner" style="padding-top:18px">
    <a class="back" href="index.html">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      Voltar para a lista</a>
    <button class="theme-toggle" id="btnTheme" title="Alternar para modo claro" aria-label="Alternar tema" style="border-color:var(--line);color:var(--ink);background:var(--card)">
      <svg id="iconMoon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg id="iconSun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span id="themeLabel">Modo claro</span>
    </button>
  </div>

  <div class="manual-head" id="manualHead" style="margin-top:12px"></div>

  <div class="toolbar actions-row">
    <button class="btn" id="btnEdit">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>
      <span>Editar manual</span></button>
    <button class="btn ghost" id="btnAdd">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Adicionar passo</button>
    <button class="btn ghost" id="btnPrint">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      Imprimir / PDF</button>
  </div>

  <div class="editor" id="editor" style="display:none">
    <b>Modo edição</b>
    <div class="hint">Tudo é salvo automaticamente neste navegador. Para levar a outro PC, volte à lista e use “Exportar backup”.</div>
    <label>Descrição / resumo do manual</label>
    <textarea id="fDescricao" placeholder="Ex.: rotina diária feita no sistema X antes das 10h…"></textarea>
    <div id="passosEdit"></div>
  </div>

  <div class="steps" id="steps"></div>

  <footer>Manuais do escritório • instruções por escrito em cada passo • imagens são opcionais e só ilustram.</footer>
</main>

<div class="lightbox" id="lightbox"><span id="lightClose">✕</span><img id="lightImg" alt="print ampliado"></div>

<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/theme.js"></script>
<script src="js/manual.js"></script>
</body>
</html>
